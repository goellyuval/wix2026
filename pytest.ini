[pytest]
testpaths = tests
pythonpath = .
base_url = https://www.wix.com
# On failure, keep a Playwright trace + screenshot in test-results/ (open with: playwright show-trace <zip>)
# --strict-markers: a typo in a tag (e.g. "santy") fails the run instead of silently selecting nothing.
addopts = -v --browser chromium --tracing retain-on-failure --screenshot only-on-failure --strict-markers

# Suites: pick with -m, combine with and/or/not. Examples:
#   pytest -m sanity              every commit: fast critical path (~6 tests)
#   pytest -m regression          nightly: everything
#   pytest -m api  /  -m ui       one layer
#   pytest -m "sanity and api"    combined
markers =
    sanity: fast critical-path checks, run on every commit
    regression: full coverage, run nightly (every test has it)
    api: public Domain Search API tests
    ui: browser tests against the wix.com web doors

# Logs are captured and shown only for failing tests.
# Live debug output: pytest --log-cli-level=DEBUG   (INFO = requests/actions, DEBUG = + response bodies)
log_level = INFO
log_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_cli_format = %(asctime)s %(levelname)-5s %(name)s: %(message)s
log_date_format = %H:%M:%S
log_cli_date_format = %H:%M:%S
